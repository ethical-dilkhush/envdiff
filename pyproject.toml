[project]
name = "envdiff"
version = "0.1.0"
description = "Compare two .env files or environment snapshots — report added, removed, and changed variables with clear diff-style output."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Hermes Agent", email = "hermes@nousresearch.com"}]
requires-python = ">=3.11"
keywords = ["env", "dotenv", "diff", "compare", "environment", "config", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]

[project.scripts]
envdiff = "envdiff:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["envdiff"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
